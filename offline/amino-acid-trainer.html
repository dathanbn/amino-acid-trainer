/* ================================================================ 1. tokens */

:root {
  color-scheme: light;

  /* sky (scene), midday defaults */
  --sky-top: #4fa8ee;
  --sky-mid: #8cc8f5;
  --sky-horizon: #d6eefc;
  --sky-hill-back: #bfe6d9;
  --sky-hill-front: #9fd6c6;
  --sky-ink: #10263f;
  --sky-ink-shadow: rgba(255, 255, 255, 0.5);
  --sky-sun-inner: #fffdf0;
  --sky-sun-outer: #ffe07a;
  --sky-sun-glow: rgba(255, 244, 190, 0.65);
  --sky-moon-glow: rgba(150, 170, 255, 0);
  --sky-sun-x: 50vw;
  --sky-sun-y: 300px;
  --sky-sun-size: 88px;
  --sky-sun-opacity: 1;
  --sky-sun-display: block;
  --sky-moon-x: 50vw;
  --sky-moon-y: 300px;
  --sky-moon-size: 64px;
  --sky-moon-opacity: 0;
  --sky-moon-display: none;
  --sky-moon-illum: 1;
  --sky-moon-waxing: 1;
  --sky-cloud-fill: #ffffff;
  --sky-cloud-opacity: 1;
  --sky-star-opacity: 0;

  /* surfaces (light polarity) */
  --sd-bg: var(--sky-mid);
  --sd-glass: rgba(255, 255, 255, 0.72);
  --sd-glass-hi: rgba(255, 255, 255, 0.8);
  --sd-glass-border: rgba(255, 255, 255, 0.85);
  --sd-surface: rgba(255, 255, 255, 0.9);
  --sd-surface-solid: rgba(255, 255, 255, 0.97);
  --sd-surface-sunk: rgba(238, 243, 248, 0.95);
  --sd-blur: 18px;
  --sd-border: rgba(19, 32, 47, 0.09);
  --sd-scrim: rgba(15, 30, 55, 0.36);

  /* clear liquid glass: the theme pin sits directly on the sky */
  --lg-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.06) 100%);
  --lg-rim: rgba(255, 255, 255, 0.45);
  --lg-blur: blur(14px) saturate(115%);
  --lg-depth:
    inset 0 1px 0 rgba(255, 255, 255, 0.85), inset 0 -1px 0 rgba(255, 255, 255, 0.22),
    inset 0 0 14px rgba(255, 255, 255, 0.18), 0 6px 22px rgba(16, 38, 63, 0.1);
  --lg-hover: rgba(255, 255, 255, 0.22);
  --lg-ink: var(--sky-lg-ink, var(--sky-ink));
  --lg-scrim: var(--sky-lg-scrim, transparent);
  --lg-base: var(--lg-fill), var(--lg-scrim);

  /* ink */
  --sd-ink: #13202f;
  --sd-ink-2: #475569;
  --sd-ink-3: #5b6b82;

  /* accent */
  --sd-accent: #8cc4f0;
  --sd-accent-soft: #dceefc;
  --sd-accent-text: #1a62a0;
  --sd-on-accent: #0f2236;
  --sd-focus-ring: #0f416f;
  --sd-focus-halo: #ffffff;

  /* feedback */
  --sd-danger: #b42318;
  --sd-danger-soft: rgba(253, 236, 234, 0.95);
  --sd-good: #0b6b3a;
  --sd-good-soft: rgba(228, 246, 236, 0.95);

  /* categories (identity): always beside a name, never alone */
  --sd-cat-3: #1baf7a;
  --sd-cat-4: #eda100;
  --sd-cat-5: #e87ba4;
  --sd-cat-7: #6250d6;
  --sd-cat-8: #e34948;

  /* type */
  --sd-font-sans: 'Nunito Variable', 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sd-fs-xs: 13px;
  --sd-fs-sm: 15px;
  --sd-fs-md: 17px;
  --sd-fs-lg: 21px;
  --sd-fs-section: 22px;
  --sd-fs-xl: 30px;
  --sd-fs-stat: 34px;
  --sd-fw-regular: 500;
  --sd-fw-medium: 600;
  --sd-fw-semibold: 700;
  --sd-fw-heavy: 800;

  /* space (4px base) */
  --sd-space-1: 4px;
  --sd-space-2: 8px;
  --sd-space-3: 12px;
  --sd-space-4: 16px;
  --sd-space-5: 24px;
  --sd-space-6: 32px;
  --sd-space-7: 48px;
  --sd-space-8: 64px;

  /* radii */
  --sd-radius-sm: 12px;
  --sd-radius-md: 18px;
  --sd-radius-lg: 28px;
  --sd-radius-pill: 999px;

  /* shadows: sky-blue tinted by day */
  --sd-shadow-sm: 0 2px 6px rgba(31, 111, 178, 0.1);
  --sd-shadow-md: 0 8px 24px rgba(31, 111, 178, 0.14), 0 1px 3px rgba(19, 32, 47, 0.06);
  --sd-shadow-lg: 0 16px 44px rgba(31, 111, 178, 0.18), 0 2px 6px rgba(19, 32, 47, 0.06);

  /* motion */
  --sd-dur-fast: 120ms;
  --sd-dur-base: 200ms;
  --sd-dur-slow: 320ms;
  --sd-dur-flip: 600ms;
  --sd-ease-standard: cubic-bezier(0.2, 0, 0, 1);
  --sd-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* layout */
  --sd-nav-h: 72px;
  --sd-content-max: 1120px;
  --sd-gutter: 16px;

  /* the molecule: backbone in secondary ink, side chain in the accent */
  --mol-backbone: var(--sd-ink-2);
  --mol-side: var(--sd-accent-text);
  --mol-halo: #ffffff;
}

@media (min-width: 900px) {
  :root { --sd-gutter: 32px; }
}

:root[data-theme='dark'] {
  color-scheme: dark;

  --sky-top: #0b1430;
  --sky-mid: #16244d;
  --sky-horizon: #2b3d73;
  --sky-hill-back: #1a2a55;
  --sky-hill-front: #142147;
  --sky-ink: #ffffff;
  --sky-ink-shadow: rgba(0, 0, 0, 0.35);
  --sky-sun-opacity: 0;
  --sky-sun-display: none;
  --sky-moon-glow: rgba(159, 180, 255, 0.4);
  --sky-moon-opacity: 1;
  --sky-moon-display: block;
  --sky-cloud-fill: #56639a;
  --sky-cloud-opacity: 0.22;
  --sky-star-opacity: 1;

  --sd-glass: rgba(18, 27, 43, 0.78);
  --sd-glass-hi: rgba(18, 27, 43, 0.86);
  --sd-glass-border: rgba(156, 211, 245, 0.16);
  --sd-surface: rgba(18, 27, 43, 0.88);
  --sd-surface-solid: rgba(18, 27, 43, 0.95);
  --sd-surface-sunk: rgba(14, 22, 37, 0.92);
  --sd-border: rgba(156, 211, 245, 0.12);
  --sd-scrim: rgba(0, 0, 0, 0.55);

  --lg-fill: linear-gradient(180deg, rgba(255, 255, 255, 0.13) 0%, rgba(255, 255, 255, 0.04) 100%);
  --lg-rim: rgba(255, 255, 255, 0.2);
  --lg-blur: blur(12px) saturate(160%);
  --lg-depth:
    inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 0 14px rgba(255, 255, 255, 0.05),
    0 6px 22px rgba(0, 0, 0, 0.25);
  --lg-hover: rgba(255, 255, 255, 0.08);
  --lg-ink: var(--sky-lg-ink, #eef5ff);

  --sd-ink: #e6eef7;
  --sd-ink-2: #a9b8cc;
  --sd-ink-3: #8c9db4;

  --sd-accent: #9cd3f5;
  --sd-accent-soft: #1d3550;
  --sd-accent-text: #9cd3f5;
  --sd-on-accent: #0b1220;
  --sd-focus-ring: #9cd3f5;
  --sd-focus-halo: #0b1220;

  --sd-danger: #f4a6a0;
  --sd-danger-soft: rgba(58, 30, 36, 0.92);
  --sd-good: #8fd8ae;
  --sd-good-soft: rgba(22, 52, 38, 0.92);

  --sd-cat-3: #199e70;
  --sd-cat-4: #c98500;
  --sd-cat-5: #d55181;
  --sd-cat-7: #9085e9;
  --sd-cat-8: #e66767;

  --sd-shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
  --sd-shadow-md: 0 8px 28px rgba(0, 0, 0, 0.38);
  --sd-shadow-lg: 0 18px 52px rgba(0, 0, 0, 0.48);

  --mol-halo: #121b2b;
}

/* No backdrop-filter: glass and cards go more opaque so the same ink still passes. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root {
    --sd-glass: rgba(255, 255, 255, 0.9);
    --sd-glass-hi: rgba(255, 255, 255, 0.94);
    --sd-surface: rgba(255, 255, 255, 0.97);
    --lg-fill: linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92));
    --lg-scrim: transparent;
    --lg-rim: var(--sd-glass-border);
    --lg-blur: none;
    --lg-hover: var(--sd-accent-soft);
    --lg-ink: var(--sd-ink);
  }
  :root[data-theme='dark'] {
    --sd-glass: rgba(18, 27, 43, 0.9);
    --sd-glass-hi: rgba(18, 27, 43, 0.94);
    --sd-surface: rgba(18, 27, 43, 0.97);
    --lg-fill: linear-gradient(rgba(18, 27, 43, 0.92), rgba(18, 27, 43, 0.92));
    --lg-scrim: transparent;
    --lg-hover: var(--sd-accent-soft);
    --lg-ink: var(--sd-ink);
  }
}

@media (forced-colors: active) {
  :root {
    --sd-glass: Canvas;
    --sd-glass-hi: Canvas;
    --sd-surface: Canvas;
    --sd-surface-solid: Canvas;
    --sd-surface-sunk: Canvas;
    --sd-glass-border: CanvasText;
    --lg-fill: linear-gradient(Canvas, Canvas);
    --lg-scrim: transparent;
    --lg-rim: CanvasText;
    --lg-ink: CanvasText;
    --lg-hover: Canvas;
    --sd-border: CanvasText;
    --sd-ink: CanvasText;
    --sd-ink-2: CanvasText;
    --sd-ink-3: CanvasText;
    --sky-ink: CanvasText;
    --mol-backbone: CanvasText;
    --mol-side: Highlight;
    --mol-halo: Canvas;
  }
  .scene { display: none; }
}

/* ================================================================== 2. base */

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background-color: var(--sd-bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--sd-font-sans);
  font-size: var(--sd-fs-md);
  line-height: 1.5;
  font-weight: var(--sd-fw-regular);
  color: var(--sd-ink);
  background-color: transparent;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.modal-open { overflow: hidden; }

h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:disabled { cursor: default; }
a { color: var(--sd-accent-text); }
svg { display: block; }

/* Two-tone focus indicator: readable on every sky stop and every surface. */
:focus-visible {
  outline: 2px solid var(--sd-focus-ring);
  outline-offset: 2px;
  box-shadow: 0 0 0 4px var(--sd-focus-halo);
}

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}

kbd {
  font-family: var(--sd-font-sans);
  font-size: var(--sd-fs-xs);
  font-weight: var(--sd-fw-medium);
  min-width: 24px;
  padding: 2px 8px;
  display: inline-block;
  text-align: center;
  border-radius: 6px;
  background: var(--sd-surface-sunk);
  border: 1px solid var(--sd-border);
  color: var(--sd-ink-2);
}

/* The page cross-fades between polarities; only these properties animate. */
.card, .seg, .chip, .btn--secondary, .iconbtn--ghost, .letter, .opt, .input {
  transition:
    background-color var(--sd-dur-flip) ease,
    color var(--sd-dur-flip) ease,
    border-color var(--sd-dur-flip) ease;
}

/* Page hidden: every scene animation pauses. */
html[data-hidden] .scene * { animation-play-state: paused !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .scene * { animation: none !important; }
}

/* ================================================================= 3. scene */

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  contain: strict;
  background: linear-gradient(var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-horizon) 100%);
  transition: background var(--sd-dur-flip) ease;
}

.scene__stars {
  position: absolute; inset: 0;
  opacity: var(--sky-star-opacity);
  visibility: var(--sky-star-vis, hidden);
  transition: opacity var(--sd-dur-flip) ease;
}
.scene__stars i {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.45; transform: scale(0.9); }
  50% { opacity: 1; transform: scale(1.15); }
}

.scene__sun {
  position: absolute;
  display: var(--sky-sun-display);
  left: var(--sky-sun-x);
  top: var(--sky-sun-y);
  width: var(--sky-sun-size);
  height: var(--sky-sun-size);
  margin: calc(var(--sky-sun-size) / -2) 0 0 calc(var(--sky-sun-size) / -2);
  border-radius: 50%;
  background: radial-gradient(circle at 40% 38%, var(--sky-sun-inner), var(--sky-sun-outer) 70%);
  box-shadow: 0 0 calc(var(--sky-sun-size) * 0.9) calc(var(--sky-sun-size) * 0.25) var(--sky-sun-glow);
  opacity: var(--sky-sun-opacity);
}

.scene__moon {
  position: absolute;
  display: var(--sky-moon-display);
  left: var(--sky-moon-x);
  top: var(--sky-moon-y);
  width: var(--sky-moon-size);
  height: var(--sky-moon-size);
  margin: calc(var(--sky-moon-size) / -2) 0 0 calc(var(--sky-moon-size) / -2);
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 42% 40%, #fbfdff, #d9e4f6 75%);
  box-shadow: 0 0 calc(var(--sky-moon-size) * 0.9) calc(var(--sky-moon-size) * 0.2) var(--sky-moon-glow);
  opacity: var(--sky-moon-opacity);
}
/* The terminator: a disc of sky slides across the moon by (1 - illumination). */
.scene__moon::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  background: var(--sky-mid);
  transform: translateX(calc(var(--sky-moon-waxing) * (1 - var(--sky-moon-illum)) * var(--sky-moon-size)));
  transition: transform var(--sd-dur-flip) ease;
}

.scene__cloud {
  position: absolute;
  width: 132px; height: 56px;
  fill: var(--sky-cloud-fill);
  opacity: var(--sky-cloud-opacity);
  transition: opacity var(--sd-dur-flip) ease;
  animation: drift linear infinite;
}
.scene__cloud--1 { top: 12%; animation-duration: 210s; }
.scene__cloud--2 { top: 24%; width: 164px; height: 70px; animation-duration: 250s; animation-delay: -90s; }
.scene__cloud--3 { top: 36%; width: 108px; height: 46px; animation-duration: 160s; animation-delay: -40s; }
@keyframes drift {
  from { transform: translateX(-20vw); }
  to { transform: translateX(120vw); }
}

.scene__hill {
  position: absolute;
  left: -10vw;
  right: -10vw;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  transition: background-color var(--sd-dur-flip) ease;
}
.scene__hill--back {
  bottom: -2vh;
  height: clamp(84px, 18vh, 170px);
  background: var(--sky-hill-back);
}
.scene__hill--front {
  bottom: -6vh;
  left: 20vw;
  right: -30vw;
  height: clamp(60px, 13vh, 130px);
  background: var(--sky-hill-front);
}

/* ============================================ 4. Sky Diary components */

/* ---- frosted glass recipe ---- */
.seg, .chip, .btn--secondary, .iconbtn--ghost {
  background: var(--sd-glass);
  border: 1px solid var(--sd-glass-border);
  -webkit-backdrop-filter: blur(var(--sd-blur)) saturate(140%);
  backdrop-filter: blur(var(--sd-blur)) saturate(140%);
}

/* ---- buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 20px;
  border: 1px solid transparent;
  border-radius: var(--sd-radius-pill);
  font-weight: var(--sd-fw-semibold);
  line-height: 1;
  white-space: nowrap;
  transition:
    background-color var(--sd-dur-fast) var(--sd-ease-standard),
    color var(--sd-dur-flip) ease,
    transform 240ms var(--sd-ease-spring),
    box-shadow var(--sd-dur-fast) var(--sd-ease-standard);
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(0.94); transition-duration: 80ms; }
.btn:disabled { color: var(--sd-ink-3); }
.btn--primary {
  background: var(--sd-accent);
  color: var(--sd-on-accent);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.55), var(--sd-shadow-sm);
}
.btn--primary:hover:not(:disabled) { filter: brightness(0.97); }
.btn--primary:disabled { background: var(--sd-surface-sunk); box-shadow: none; border-color: var(--sd-border); }
.btn--secondary { color: var(--sd-ink); box-shadow: var(--sd-shadow-sm); }
.btn--secondary:hover:not(:disabled) { background: var(--sd-glass-hi); }
.btn--ghost { background: transparent; color: var(--sd-ink-2); }
.btn--ghost:hover:not(:disabled) { background: var(--sd-accent-soft); }
.btn--text { background: transparent; color: var(--sd-accent-text); padding: 0 14px; }
.btn--text:hover:not(:disabled) { background: var(--sd-accent-soft); }
.btn--danger {
  background: var(--sd-glass); border-color: var(--sd-glass-border);
  color: var(--sd-danger); box-shadow: var(--sd-shadow-sm);
}
.btn--danger:hover:not(:disabled) { background: var(--sd-danger-soft); }
.btn--full { width: 100%; }
.btn .icon { width: 20px; height: 20px; }

.iconbtn {
  --size: 44px;
  position: relative;
  display: inline-grid;
  place-items: center;
  width: var(--size);
  height: var(--size);
  flex: none;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--sd-ink-2);
  transition: background-color var(--sd-dur-fast) var(--sd-ease-standard), transform 240ms var(--sd-ease-spring);
}
.iconbtn:hover:not(:disabled) { background: var(--sd-accent-soft); color: var(--sd-ink); transform: translateY(-1px); }
.iconbtn:active:not(:disabled) { transform: scale(0.94); transition-duration: 80ms; }
.iconbtn--ghost { border: 1px solid var(--sd-glass-border); color: var(--sd-ink); box-shadow: var(--sd-shadow-sm); }
.iconbtn--ghost:hover:not(:disabled) { background: var(--sd-glass-hi); }
.iconbtn svg { width: 20px; height: 20px; }

/* Controls with their own shadow repeat the focus halo on top of it. */
.btn--primary:focus-visible { box-shadow: 0 0 0 4px var(--sd-focus-halo), inset 0 2px 0 rgba(255, 255, 255, 0.55), var(--sd-shadow-sm); }
.btn--secondary:focus-visible, .btn--danger:focus-visible, .iconbtn--ghost:focus-visible { box-shadow: 0 0 0 4px var(--sd-focus-halo), var(--sd-shadow-sm); }

/* tooltips for icon buttons (desktop hover and keyboard focus) */
@media (hover: hover) and (min-width: 900px) {
  [data-tip]:hover::after, [data-tip]:focus-visible::after {
    content: attr(data-tip);
    position: absolute; z-index: 40;
    top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    padding: 6px 12px;
    border-radius: var(--sd-radius-sm);
    background: var(--sd-ink);
    color: var(--sd-surface-solid);
    font-size: var(--sd-fs-xs);
    font-weight: var(--sd-fw-semibold);
    line-height: 16px;
    white-space: nowrap;
    pointer-events: none;
  }
}

/* ---- segmented ---- */
.seg {
  display: inline-flex;
  padding: 4px;
  gap: 2px;
  border-radius: var(--sd-radius-pill);
  max-width: 100%;
}
.seg--full { display: flex; width: 100%; }
.seg__opt {
  flex: 1 1 auto;
  min-height: 40px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--sd-radius-pill);
  background: transparent;
  color: var(--sd-ink-2);
  font-weight: var(--sd-fw-semibold);
  font-size: var(--sd-fs-sm);
  white-space: nowrap;
  transition:
    background-color var(--sd-dur-base) var(--sd-ease-standard),
    color var(--sd-dur-base) var(--sd-ease-standard),
    transform 240ms var(--sd-ease-spring);
}
.seg__opt:hover:not([aria-checked='true']) { color: var(--sd-ink); }
.seg__opt:active { transform: scale(0.94); }
/* selected: fill + inset edge + weight 800, never colour alone */
.seg__opt[aria-checked='true'] {
  background: var(--sd-accent);
  color: var(--sd-on-accent);
  font-weight: var(--sd-fw-heavy);
  box-shadow: inset 0 0 0 2px var(--sd-accent-text);
}
.seg__opt[aria-checked='true']:focus-visible { box-shadow: 0 0 0 4px var(--sd-focus-halo), inset 0 0 0 2px var(--sd-accent-text); }
@media (max-width: 899px) {
  .seg { padding: 3px; }
  .seg__opt { min-height: 44px; min-width: 44px; padding: 0 12px; }
}

/* ---- cards ---- */
.card {
  background: var(--sd-surface);
  border: 1px solid var(--sd-glass-border);
  -webkit-backdrop-filter: blur(var(--sd-blur)) saturate(140%);
  backdrop-filter: blur(var(--sd-blur)) saturate(140%);
  border-radius: var(--sd-radius-lg);
  box-shadow: var(--sd-shadow-md);
  padding: 18px;
  min-width: 0;
}
.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: var(--sd-space-3);
}
.card__title {
  font-size: var(--sd-fs-lg);
  line-height: 28px;
  font-weight: var(--sd-fw-heavy);
}
.card > * + *:not(.card__head) { margin-top: var(--sd-space-3); }
@media (min-width: 900px) { .card { padding: 24px; } }

/* ---- chip ---- */
.chip {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: var(--sd-radius-pill);
  color: var(--sd-accent-text);
  font-size: var(--sd-fs-xs);
  font-weight: var(--sd-fw-heavy);
  line-height: 20px;
}

/* ---- fields ---- */
.input {
  width: 100%;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--sd-border);
  border-radius: var(--sd-radius-sm);
  background: var(--sd-surface-sunk);
  color: var(--sd-ink);
  transition: border-color var(--sd-dur-fast) var(--sd-ease-standard);
}
.input::placeholder { color: var(--sd-ink-3); }
.input:hover { border-color: var(--sd-ink-3); }
.input:focus-visible { outline-offset: 0; border-color: var(--sd-focus-ring); }
.hint { color: var(--sd-ink-3); font-size: var(--sd-fs-xs); line-height: 18px; }

/* ---- dialog ---- */
.scrim {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 16px;
  background: var(--sd-scrim);
  -webkit-backdrop-filter: blur(4px);
  backdrop-filter: blur(4px);
  animation: view-in var(--sd-dur-base) var(--sd-ease-standard);
}
.dialog {
  width: min(480px, 100%);
  display: flex;
  flex-direction: column;
  border-radius: var(--sd-radius-lg);
  background: var(--sd-surface-solid);
  box-shadow: var(--sd-shadow-lg);
  border: 1px solid var(--sd-glass-border);
  outline: none;
}
.dialog__head { padding: 20px 24px 0; }
.dialog__title { font-size: var(--sd-fs-lg); line-height: 28px; font-weight: var(--sd-fw-heavy); }
.dialog__body { padding: 12px 24px 24px; color: var(--sd-ink-2); }
.dialog__foot {
  display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px;
  padding: 12px 24px 20px;
  border-top: 1px solid var(--sd-border);
}
@media (max-width: 899px) {
  .scrim { place-items: end center; padding: 0; }
  .dialog {
    width: 100%;
    border-radius: var(--sd-radius-lg) var(--sd-radius-lg) 0 0;
    padding-bottom: env(safe-area-inset-bottom);
    animation: sheet-in var(--sd-dur-slow) var(--sd-ease-standard);
  }
}
@keyframes view-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---- popover ---- */
.popover {
  position: absolute;
  z-index: 30;
  border-radius: var(--sd-radius-md);
  background: var(--sd-surface-solid);
  border: 1px solid var(--sd-glass-border);
  box-shadow: var(--sd-shadow-lg);
}

/* ========================================================== 5. the app */

.wrap {
  position: relative;
  z-index: 1;
  max-width: var(--sd-content-max);
  margin: 0 auto;
  padding: 0 var(--sd-gutter) var(--sd-space-8);
}

.view { animation: view-in var(--sd-dur-base) var(--sd-ease-standard); }

/* ---- header: the brand sits on the sky, the pin is clear glass ---- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: var(--sd-nav-h);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--sky-ink);
  font-size: 20px;
  line-height: 28px;
  font-weight: var(--sd-fw-heavy);
  text-shadow: 0 1px 10px var(--sky-ink-shadow);
  letter-spacing: -0.01em;
}
.brand svg { width: 28px; height: 28px; }
.pin {
  background: var(--lg-base);
  border: 1px solid var(--lg-rim);
  -webkit-backdrop-filter: var(--lg-blur);
  backdrop-filter: var(--lg-blur);
  box-shadow: var(--lg-depth);
  color: var(--lg-ink);
}
.pin:hover:not(:disabled) { background: var(--lg-hover), var(--lg-base); color: var(--lg-ink); }
.pin:focus-visible { box-shadow: 0 0 0 4px var(--sd-focus-halo), var(--lg-depth); }

.noscript {
  margin-bottom: var(--sd-space-4);
  padding: 16px 18px;
  border-radius: var(--sd-radius-md);
  background: var(--sd-surface);
  color: var(--sd-ink-2);
  font-size: var(--sd-fs-sm);
}

/* ---- hero: large type on the sky, nothing body-sized ---- */
.hero { padding: var(--sd-space-3) 0 var(--sd-space-5); }
.hero h1 {
  font-size: clamp(var(--sd-fs-xl), 4.5vw, 44px);
  line-height: 1.1;
  font-weight: var(--sd-fw-heavy);
  letter-spacing: -0.02em;
  color: var(--sky-ink);
  text-shadow: 0 1px 12px var(--sky-ink-shadow);
  text-wrap: balance;
  max-width: 22ch;
}

/* ---- the stack of home-screen cards ---- */
.home { display: grid; gap: var(--sd-space-4); }
/* The letter popover hangs below this card, over the mode tiles that
   follow it, so the card must sit above its later siblings. */
.progress { position: relative; z-index: 2; }

.lede { color: var(--sd-ink-2); }
.lede b { color: var(--mol-side); font-weight: var(--sd-fw-heavy); }

/* progress: two stats, the twenty letters, a foot row */
.progress__row {
  display: flex;
  align-items: center;
  gap: var(--sd-space-5);
  flex-wrap: wrap;
}
.stat { display: flex; flex-direction: column; line-height: 1.1; min-width: 72px; }
.stat b {
  font-size: var(--sd-fs-stat);
  font-weight: var(--sd-fw-heavy);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.stat span {
  font-size: var(--sd-fs-xs);
  color: var(--sd-ink-3);
  font-weight: var(--sd-fw-semibold);
}
.letters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
  min-width: 260px;
}
/* A letter: category fill that brightens with mastery, ink text so the
   letter never depends on the fill for contrast. Skipped = sunk and dashed. */
.letter {
  --cat: var(--sd-ink-3);
  --m: 0;
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  padding: 0;
  border-radius: var(--sd-radius-sm);
  border: 1px solid color-mix(in srgb, var(--cat) 45%, transparent);
  background: color-mix(in srgb, var(--cat) calc(12% + var(--m) * 58%), var(--sd-surface-solid));
  color: var(--sd-ink);
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-sm);
  transition: transform 240ms var(--sd-ease-spring), background-color var(--sd-dur-base) var(--sd-ease-standard);
}
.letter:hover { transform: translateY(-2px); }
.letter:active { transform: scale(0.94); }
.letter--off {
  background: var(--sd-surface-sunk);
  border: 1px dashed var(--sd-ink-3);
  color: var(--sd-ink-3);
  text-decoration: line-through;
}
@media (max-width: 899px) { .letter { width: 44px; height: 44px; } }

.progress__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: var(--sd-space-3);
  border-top: 1px solid var(--sd-border);
  font-size: var(--sd-fs-sm);
  color: var(--sd-ink-2);
}
.progress__foot b { color: var(--sd-ink); font-weight: var(--sd-fw-heavy); }

/* the letter card: one shared popover, filled on hover */
.lettercard { width: 260px; padding: 14px 16px 14px; pointer-events: none; }
.lettercard[hidden] { display: none; }
.lc-head { display: flex; align-items: center; gap: 10px; }
.lc-name { font-weight: var(--sd-fw-heavy); font-size: var(--sd-fs-md); line-height: 1.2; }
.lc-cls { display: flex; align-items: center; gap: 6px; font-size: var(--sd-fs-xs); color: var(--sd-ink-2); font-weight: var(--sd-fw-semibold); }
.lc-mol { height: 116px; margin-top: 10px; }
.lc-bar { height: 6px; border-radius: 3px; overflow: hidden; background: var(--sd-surface-sunk); margin-top: 8px; }
.lc-bar span { display: block; height: 100%; background: var(--sd-accent); box-shadow: inset 0 0 0 1px var(--sd-accent-text); }
.lc-stats { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: var(--sd-fs-xs); color: var(--sd-ink-2); }
.lc-stats b { color: var(--sd-ink); font-weight: var(--sd-fw-heavy); }
.lc-act { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--sd-border); font-size: var(--sd-fs-xs); font-weight: var(--sd-fw-semibold); color: var(--sd-accent-text); }
.lc-act--off { color: var(--sd-ink-2); }
.lc-act--warn { color: var(--sd-danger); }

/* category badge and dot: colour always beside the name */
.badge {
  --cat: var(--sd-ink-3);
  flex: none;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--sd-radius-sm);
  background: color-mix(in srgb, var(--cat) 22%, var(--sd-surface-solid));
  border: 1px solid color-mix(in srgb, var(--cat) 45%, transparent);
  color: var(--sd-ink);
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-md);
}
.dot {
  --cat: var(--sd-ink-3);
  display: inline-block;
  flex: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--cat);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
}

/* ---- modes ---- */
/* Every tile is the same size, in source order. The 300px floor is what the
   Gauntlet's three-way control needs at the narrowest three-column tile. */
.modes {
  display: grid;
  gap: var(--sd-space-4);
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}
.mode {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 18px;
  color: inherit;
  transition:
    transform 240ms var(--sd-ease-spring),
    box-shadow var(--sd-dur-base) var(--sd-ease-standard),
    background-color var(--sd-dur-flip) ease,
    border-color var(--sd-dur-flip) ease;
}
.mode:hover { transform: translateY(-2px); box-shadow: var(--sd-shadow-lg); }
.mode:active { transform: scale(0.98); transition-duration: 80ms; }
.mode:focus-visible { box-shadow: 0 0 0 4px var(--sd-focus-halo), var(--sd-shadow-md); }
.mode__icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: var(--sd-radius-sm);
  margin-bottom: 8px;
  background: var(--sd-accent-soft);
  color: var(--sd-accent-text);
}
.mode__icon svg { width: 22px; height: 22px; }
.mode__name { font-weight: var(--sd-fw-heavy); font-size: var(--sd-fs-md); }
.mode__desc { color: var(--sd-ink-2); font-size: var(--sd-fs-sm); line-height: 1.45; }
.mode--study .mode__icon { background: var(--sd-surface-sunk); color: var(--sd-ink-2); }
@media (min-width: 900px) { .mode { padding: 24px; } }

/* The Gauntlet tile is a container: the start button on top, the yield
   setting below a rule. Only the start area lifts. */
.mode--gauntlet { padding: 0; gap: 0; }
.mode--gauntlet:hover { transform: none; box-shadow: var(--sd-shadow-md); }
.mode--gauntlet:has(.mode__go:hover) { transform: translateY(-2px); box-shadow: var(--sd-shadow-lg); }
.mode__go {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  padding: 18px;
  background: none;
  border: 0;
  color: inherit;
  border-radius: var(--sd-radius-lg) var(--sd-radius-lg) 0 0;
}
.mode__yield {
  display: grid;
  gap: 8px;
  padding: 12px 18px 16px;
  border-top: 1px solid var(--sd-border);
}
.mode__yield-label {
  font-size: var(--sd-fs-xs);
  font-weight: var(--sd-fw-semibold);
  color: var(--sd-ink-2);
}
/* three pills in a single-width tile: small type, tight padding */
.mode__yield .seg { padding: 3px; }
.mode__yield .seg__opt { min-width: 0; min-height: 36px; padding: 0 6px; font-size: var(--sd-fs-xs); }
@media (min-width: 900px) {
  .mode__go { padding: 24px; }
  .mode__yield { padding: 12px 24px 18px; }
}

.footnote { color: var(--sky-ink); text-shadow: 0 1px 10px var(--sky-ink-shadow); font-weight: var(--sd-fw-semibold); font-size: var(--sd-fs-md); }

/* ---- quiz bar ---- */
.quizbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: var(--sd-space-4);
}
.quizbar__mid { display: flex; align-items: center; gap: 10px; flex: 1; }
.quizbar__right { display: flex; align-items: center; gap: 10px; }
.counter {
  color: var(--sky-ink);
  text-shadow: 0 1px 10px var(--sky-ink-shadow);
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-sm);
  font-variant-numeric: tabular-nums;
}
.clock, .score, .streak {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 14px;
  border-radius: var(--sd-radius-pill);
  background: var(--sd-glass);
  border: 1px solid var(--sd-glass-border);
  -webkit-backdrop-filter: blur(var(--sd-blur)) saturate(140%);
  backdrop-filter: blur(var(--sd-blur)) saturate(140%);
  color: var(--sd-ink);
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-sm);
  font-variant-numeric: tabular-nums;
}
.streak { color: var(--sd-accent-text); }

/* ---- the question card ---- */
.prompt {
  font-size: var(--sd-fs-lg);
  line-height: 1.35;
  font-weight: var(--sd-fw-medium);
  letter-spacing: -0.01em;
}
.prompt b { font-weight: var(--sd-fw-heavy); }
.stage {
  height: 300px;
  padding: 18px;
  border-radius: var(--sd-radius-md);
  background: var(--sd-surface-sunk);
  border: 1px solid var(--sd-border);
}

/* ---- molecule ---- */
svg.mol { width: 100%; height: 100%; display: block; overflow: visible; }
svg.mol line {
  stroke-linecap: round;
  vector-effect: non-scaling-stroke;
  stroke-width: 2px;
  transition: stroke var(--sd-dur-flip) ease;
}
svg.mol line.bb { stroke: var(--mol-backbone); }
svg.mol line.sc { stroke: var(--mol-side); }
svg.mol text {
  font-size: 0.46px;
  font-family: var(--sd-font-sans);
  font-weight: var(--sd-fw-semibold);
  dominant-baseline: central;
  paint-order: stroke;
  stroke: var(--mol-halo);
  stroke-width: 0.16px;
  stroke-linejoin: round;
  transition: fill var(--sd-dur-flip) ease;
}
svg.mol text.bb { fill: var(--mol-backbone); }
svg.mol text.sc { fill: var(--mol-side); }

/* ---- answers ---- */
.opts { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.opts--one { grid-template-columns: 1fr; }
.opt {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 10px 14px;
  text-align: left;
  border-radius: var(--sd-radius-sm);
  background: var(--sd-surface-sunk);
  border: 1px solid var(--sd-border);
  color: var(--sd-ink);
  transition:
    background-color var(--sd-dur-fast) var(--sd-ease-standard),
    border-color var(--sd-dur-fast) var(--sd-ease-standard),
    transform 240ms var(--sd-ease-spring);
}
.opt:hover:not(:disabled) { background: var(--sd-accent-soft); border-color: var(--sd-accent); transform: translateY(-1px); }
.opt:active:not(:disabled) { transform: scale(0.98); transition-duration: 80ms; }
.opt:disabled { cursor: default; }
.opt__body { flex: 1; min-width: 0; }
.opt .dim { color: var(--sd-ink-2); font-weight: var(--sd-fw-regular); }
/* outcome: fill plus an inset edge, so it never rests on colour alone */
.opt--good { background: var(--sd-good-soft); border-color: transparent; box-shadow: inset 0 0 0 2px var(--sd-good); }
.opt--bad { background: var(--sd-danger-soft); border-color: transparent; box-shadow: inset 0 0 0 2px var(--sd-danger); }
.opt--good kbd { background: var(--sd-good); color: #fff; border-color: transparent; }
.opt--bad kbd { background: var(--sd-danger); color: #fff; border-color: transparent; }

.opts--svg { grid-template-columns: 1fr 1fr; }
.opt--svg { position: relative; height: 210px; padding: 14px; display: block; }
.opt--svg kbd { position: absolute; top: 10px; left: 10px; }

.typebox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.typebox .input { flex: 1 1 160px; font-weight: var(--sd-fw-medium); }
.typebox .input--code {
  flex: 0 0 120px;
  text-align: center;
  font-size: var(--sd-fs-xl);
  font-weight: var(--sd-fw-heavy);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  min-height: 56px;
}
.input--good { border-color: var(--sd-good); color: var(--sd-good); }
.input--bad { border-color: var(--sd-danger); color: var(--sd-danger); }

/* ---- feedback ---- */
.verdict {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-lg);
}
.verdict--ok { color: var(--sd-good); }
.verdict--no { color: var(--sd-danger); }
.verdict em { font-style: normal; font-weight: var(--sd-fw-regular); font-size: var(--sd-fs-sm); color: var(--sd-ink-2); }

/* the working-out: a sunk section inside the card, never a nested card */
.explain {
  padding: 16px 18px;
  border-radius: var(--sd-radius-md);
  background: var(--sd-surface-sunk);
  border: 1px solid var(--sd-border);
}
.explain > * + * { margin-top: var(--sd-space-3); }
.ex-head { display: flex; align-items: center; gap: 12px; }
.ex-name { font-weight: var(--sd-fw-heavy); }
.ex-cls { display: flex; align-items: center; gap: 6px; font-size: var(--sd-fs-xs); color: var(--sd-ink-2); font-weight: var(--sd-fw-semibold); }
.ex-extra { font-size: var(--sd-fs-sm); color: var(--sd-ink-2); }
.ex-grid {
  display: grid;
  gap: 8px 18px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  font-size: var(--sd-fs-sm);
}
.ex-grid > div { display: flex; flex-direction: column; }
.ex-grid span { font-size: var(--sd-fs-xs); color: var(--sd-ink-3); font-weight: var(--sd-fw-semibold); }
.ex-mnem {
  padding-top: var(--sd-space-3);
  border-top: 1px solid var(--sd-border);
  font-size: var(--sd-fs-sm);
  color: var(--sd-ink-2);
  font-style: italic;
}

.tw { overflow-x: auto; }
.ion-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--sd-fs-sm);
  color: var(--sd-ink);
  min-width: 340px;
}
.ion-table th {
  text-align: left;
  font-size: var(--sd-fs-xs);
  color: var(--sd-ink-3);
  font-weight: var(--sd-fw-semibold);
  padding-bottom: 5px;
  white-space: nowrap;
}
.ion-table td { padding: 6px 10px 6px 0; border-top: 1px solid var(--sd-border); }
.ion-table .n, .ion-table .q { font-variant-numeric: tabular-nums; }
.ion-table th.q, .ion-table td.q { text-align: right; padding-right: 0; font-weight: var(--sd-fw-heavy); }
.ion-table tfoot td { border-top: 2px solid var(--sd-accent); font-weight: var(--sd-fw-heavy); padding-top: 8px; }

/* charge signs: a sign, a weight and a tone — never the tone alone */
.chg-pos { color: var(--sd-accent-text); }
.chg-neg { color: var(--sd-danger); }
.chg-zero { color: var(--sd-ink-2); }

.ladder {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 6px 2px;
  width: max-content;
  margin: 0 auto;
}
.lad-q {
  flex: none;
  min-width: 40px;
  padding: 6px 10px;
  border-radius: var(--sd-radius-pill);
  font-weight: var(--sd-fw-heavy);
  font-size: var(--sd-fs-sm);
  text-align: center;
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--sd-border);
  background: var(--sd-surface-solid);
}
.lad-q.chg-zero {
  background: var(--sd-accent);
  color: var(--sd-on-accent);
  box-shadow: inset 0 0 0 2px var(--sd-accent-text);
}
.lad-p { flex: none; font-size: var(--sd-fs-xs); color: var(--sd-ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lad-p::before { content: '\2192\00a0'; }
.lad-p::after { content: '\00a0\2192'; }
.lad-note { font-size: var(--sd-fs-sm); color: var(--sd-ink-2); }

/* ---- results ---- */
.results { text-align: center; }
.results__mode { color: var(--sd-ink-2); font-weight: var(--sd-fw-semibold); }
.bigscore {
  font-size: clamp(56px, 12vw, 88px);
  line-height: 1;
  font-weight: var(--sd-fw-heavy);
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.bigscore span { font-size: var(--sd-fs-lg); color: var(--sd-ink-2); font-weight: var(--sd-fw-semibold); margin-left: 8px; letter-spacing: 0; }
.results__pct { color: var(--sd-ink-2); }
.results__best { color: var(--sd-accent-text); font-weight: var(--sd-fw-heavy); }
.results__clean { color: var(--sd-good); font-weight: var(--sd-fw-heavy); }
.results h3 { margin-top: var(--sd-space-5); font-size: var(--sd-fs-xs); color: var(--sd-ink-3); font-weight: var(--sd-fw-semibold); letter-spacing: 0.04em; text-transform: uppercase; }
.missed { display: grid; gap: 8px; text-align: left; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.missed__row {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 10px 12px;
  border-radius: var(--sd-radius-md);
  background: var(--sd-surface-sunk);
  border: 1px solid var(--sd-border);
}
.missed__mol { flex: none; width: 92px; height: 92px; }
.missed__body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.missed__note { font-size: var(--sd-fs-xs); color: var(--sd-ink-2); font-style: italic; }
.results__actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

/* ---- reference ---- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: var(--sd-space-4); }
.filter {
  display: inline-flex;
  align-items: center;
  gap: 8px;

function aa(code) { return BY_CODE[code]; }

/* HTML-escape for anything that reaches innerHTML. data.js loads first,
   so chem.js and app.js share this one. */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* Accepted spellings when the player types a full name */
function nameMatches(input, a) {
  const norm = s => s.toLowerCase().replace(/[^a-z]/g, '');
  const target = [a.name, ...a.alt].map(norm);
  return target.includes(norm(input));
}

  return 'Non-essential';

function pKaLadder(code) {
  const a = BY_CODE[code];
  const [pK1, pK2] = BACKBONE_PKA[code];
  const rungs = [
    { pKa: pK1, from: 0, to: -1, group: 'α-carboxyl' },
    { pKa: pK2, from: 1, to: 0, group: 'α-amino' }
  ];
  if (a.pKaR) {
    rungs.push(R_BASIC.includes(code)
      ? { pKa: a.pKaR, from: 1, to: 0, group: 'side chain' }
      : { pKa: a.pKaR, from: 0, to: -1, group: 'side chain' });
  }
  return rungs.sort((x, y) => x.pKa - y.pKa);
}

/* Net charge on the whole amino acid at a given pH. A group is
   deprotonated once pH climbs past its pKa. */
function netChargeAt(code, pH) {
  return pKaLadder(code)
    .reduce((sum, g) => sum + (pH > g.pKa ? g.to : g.from), 0);
}

/* pI is the midpoint of the two pKa values that bracket the species
   carrying no net charge. */
function computePI(code) {
  const L = pKaLadder(code);
  let charge = L.reduce((s, g) => s + g.from, 0);   // fully protonated
  for (let i = 0; i < L.length; i++) {
    charge += L[i].to - L[i].from;                  // deprotonate group i
    if (charge === 0 && i + 1 < L.length) {
      return { pI: (L[i].pKa + L[i + 1].pKa) / 2, pair: [L[i], L[i + 1]] };
    }
  }
  return null;
}

function chargeStr(n) {
  if (n > 0) return '+' + n;
  if (n < 0) return '−' + Math.abs(n);
  return '0';
}

<script>
/* ------------------------------------------------------------------
   chem.js — builds each amino acid from bond vectors and renders it
   as an SVG skeletal formula.

   Everything is laid out on a unit-bond-length grid with proper 120°
   angles. The backbone is identical for all twenty; only the side
   chain differs, and the side chain is tagged so it can be coloured
   separately — that contrast is the whole point of the drawing.
   ------------------------------------------------------------------ */

const DIR = {
  u:  [0, -1],
  d:  [0, 1],
  ur: [0.866, -0.5],
  dr: [0.866, 0.5],
  ul: [-0.866, -0.5],
  dl: [-0.866, 0.5]
};

function Mol() {
  const map = {};
  const list = [];
  const bonds = [];

  const M = {
    list, bonds,
    get(id) { return map[id]; },

    put(id, x, y, o = {}) {
      const at = {
        id, x, y,
        el: o.el || 'C',
        text: o.text || null,
        anchor: o.anchor || 'middle',
        side: !!o.side
      };
      map[id] = at;
      list.push(at);
      return M;
    },

    /* place a new atom one bond length from `from` in direction `dir` */
    go(from, dir, id, o = {}) {
      const f = map[from];
      const v = Array.isArray(dir) ? dir : DIR[dir];
      M.put(id, f.x + v[0], f.y + v[1], o);
      M.bond(from, id, o.order || 1);
      return M;
    },

    bond(a, b, order = 1, inner = null) {
      bonds.push({ a, b, order, inner, side: map[a].side || map[b].side });
      return M;
    },

    /* upgrade an existing bond to a double bond */
    dbl(a, b, inner = null) {
      const bd = bonds.find(x =>
        (x.a === a && x.b === b) || (x.a === b && x.b === a));
      if (bd) { bd.order = 2; bd.inner = inner; }
      return M;
    }
  };
  return M;
}

/* A regular n-ring hanging off `ipso`, growing away from `from`.
   `ids` holds the n-1 new atom ids in ring order.                   */
function attachRing(M, ipso, from, n, ids, o = {}) {
  const P = M.get(ipso), F = M.get(from);
  let vx = P.x - F.x, vy = P.y - F.y;
  const L = Math.hypot(vx, vy); vx /= L; vy /= L;

  const R = 0.5 / Math.sin(Math.PI / n);
  const cx = P.x + vx * R, cy = P.y + vy * R;
  const a0 = Math.atan2(P.y - cy, P.x - cx);
  const step = 2 * Math.PI / n;

  const verts = [ipso];
  ids.forEach((id, i) => {
    const a = a0 + step * (i + 1);
    M.put(id, cx + R * Math.cos(a), cy + R * Math.sin(a), o);
    verts.push(id);
  });
  for (let i = 0; i < verts.length; i++) {
    M.bond(verts[i], verts[(i + 1) % verts.length]);
  }
  return { verts, c: [cx, cy] };
}

/* A ring fused onto the existing bond aId–bId, built on the side of
   that bond facing away from the point `away`.
   `ids` holds the n-2 new atom ids, ordered from bId round to aId.  */
function fuseRing(M, aId, bId, n, ids, away, o = {}) {
  const A = M.get(aId), B = M.get(bId);
  const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;

  let px = -(B.y - A.y), py = B.x - A.x;
  const L = Math.hypot(px, py); px /= L; py /= L;
  if ((mx - away[0]) * px + (my - away[1]) * py < 0) { px = -px; py = -py; }

  const R = 0.5 / Math.sin(Math.PI / n);
  const ap = 0.5 / Math.tan(Math.PI / n);
  const cx = mx + px * ap, cy = my + py * ap;

  const aB = Math.atan2(B.y - cy, B.x - cx);
  const aA = Math.atan2(A.y - cy, A.x - cx);
  let diff = aA - aB;
  while (diff > Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  const step = -Math.sign(diff) * 2 * Math.PI / n;

  const verts = [bId];
  ids.forEach((id, i) => {
    const ang = aB + step * (i + 1);
    M.put(id, cx + R * Math.cos(ang), cy + R * Math.sin(ang), o);
    verts.push(id);
  });
  verts.push(aId);
  for (let i = 0; i < verts.length - 1; i++) M.bond(verts[i], verts[i + 1]);
  return { verts, c: [cx, cy] };
}

/* ------------------------------------------------------------------
   The shared backbone.  Cα sits at the origin; the amino group runs
   down-left, the carboxyl down-right, and the side chain hangs
   straight down.  All three angles are 120°.
   ------------------------------------------------------------------ */
function backbone(M, iso) {
  M.put('CA', 0, 0);
  M.put('N', -0.866, -0.5, {
    el: 'N', text: iso ? 'H₃N⁺' : 'H₂N', anchor: 'end'
  });
  M.bond('N', 'CA');
  M.put('C', 0.866, -0.5);
  M.bond('CA', 'C');
  M.put('O1', 0.866, -1.5, { el: 'O', text: 'O' });
  M.bond('C', 'O1', 2);
  M.put('O2', 1.732, 0, {
    el: 'O', text: iso ? 'O⁻' : 'OH', anchor: 'start'
  });
  M.bond('C', 'O2');
}

/* R marks every side-chain atom so the renderer can colour it. */
const R = { side: true };
const RN = { side: true, el: 'N' };
const RO = { side: true, el: 'O' };
const RS = { side: true, el: 'S' };

/* ------------------------------------------------------------------
   Side chains.  Each receives the molecule (backbone already built)
   and a flag for the pH-7 / ionised depiction.
   ------------------------------------------------------------------ */
const SIDECHAIN = {

  G(M) {
    M.go('CA', 'd', 'HB', { ...R, el: 'H', text: 'H' });
  },

  A(M) {
    M.go('CA', 'd', 'CB', R);
  },

  V(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG1', R)
     .go('CB', 'dr', 'CG2', R);
  },

  L(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'CD1', R)
     .go('CG', 'ul', 'CD2', R);
  },

  I(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG1', R)
     .go('CG1', 'd', 'CD1', R)
     .go('CB', 'dr', 'CG2', R);
  },

  P(M, iso) {
    /* the side chain closes back onto the backbone nitrogen */
    M.get('N').text = iso ? 'H₂N⁺' : 'HN';
    M.get('N').anchor = 'middle';
    fuseRing(M, 'CA', 'N', 5, ['CB', 'CG', 'CD'], [0.866, -0.5], R);
  },

  M(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'SD', { ...RS, text: 'S' })
     .go('SD', 'dl', 'CE', R);
  },

  F(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R);
    const ring = attachRing(M, 'CG', 'CB', 6,
      ['CD1', 'CE1', 'CZ', 'CE2', 'CD2'], R);
    M.dbl('CG', 'CD1', ring.c)
     .dbl('CE1', 'CZ', ring.c)
     .dbl('CE2', 'CD2', ring.c);
  },

  Y(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R);
    const ring = attachRing(M, 'CG', 'CB', 6,
      ['CD1', 'CE1', 'CZ', 'CE2', 'CD2'], R);
    M.dbl('CG', 'CD1', ring.c)
     .dbl('CE1', 'CZ', ring.c)
     .dbl('CE2', 'CD2', ring.c);

    /* para hydroxyl: straight out from the ring centre through CZ */
    const CZ = M.get('CZ');
    let vx = CZ.x - ring.c[0], vy = CZ.y - ring.c[1];
    const L = Math.hypot(vx, vy); vx /= L; vy /= L;
    M.put('OH', CZ.x + vx, CZ.y + vy, { ...RO, text: 'OH' });
    M.bond('CZ', 'OH');
  },

  W(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R);
    /* pyrrole half of the indole */
    const five = attachRing(M, 'CG', 'CB', 5,
      ['CD1', 'NE1', 'CE2', 'CD2'], R);
    M.get('NE1').el = 'N';
    M.get('NE1').text = 'NH';
    M.dbl('CG', 'CD1', five.c);
    /* benzo half, fused on C7a–C3a */
    const six = fuseRing(M, 'CE2', 'CD2', 6,
      ['CE3', 'CZ3', 'CH2', 'CZ2'], five.c, R);
    M.dbl('CD2', 'CE3', six.c)
     .dbl('CZ3', 'CH2', six.c)
     .dbl('CZ2', 'CE2', six.c);
  },

  S(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'OG', { ...RO, text: 'OH', anchor: 'end' });
  },

  T(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'OG1', { ...RO, text: 'OH', anchor: 'end' })
     .go('CB', 'dr', 'CG2', R);
  },

  C(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'SG', { ...RS, text: 'SH', anchor: 'end' });
  },

  N(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'ul', 'OD1', { ...RO, text: 'O', order: 2 })
     .go('CG', 'd', 'ND2', { ...RN, text: 'NH₂' });
  },

  Q(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'CD', R)
     .go('CD', 'dl', 'OE1', { ...RO, text: 'O', order: 2 })
     .go('CD', 'dr', 'NE2', { ...RN, text: 'NH₂', anchor: 'start' });
  },

  D(M, iso) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'ul', 'OD1', { ...RO, text: 'O', order: 2 })
     .go('CG', 'd', 'OD2', { ...RO, text: iso ? 'O⁻' : 'OH' });
  },

  E(M, iso) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'CD', R)
     .go('CD', 'dl', 'OE1', { ...RO, text: 'O', order: 2 })
     .go('CD', 'dr', 'OE2', { ...RO, text: iso ? 'O⁻' : 'OH', anchor: 'start' });
  },

  K(M, iso) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'CD', R)
     .go('CD', 'dl', 'CE', R)
     .go('CE', 'd', 'NZ', { ...RN, text: iso ? 'NH₃⁺' : 'NH₂' });
  },

  R(M, iso) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R)
     .go('CG', 'd', 'CD', R)
     .go('CD', 'dl', 'NE', { ...RN, text: 'NH', anchor: 'end' })
     .go('NE', 'd', 'CZ', R)
     .go('CZ', 'dl', 'NH1', { ...RN, text: iso ? 'NH₂⁺' : 'NH', order: 2 })
     .go('CZ', 'dr', 'NH2', { ...RN, text: 'NH₂', anchor: 'start' });
  },

  H(M) {
    M.go('CA', 'd', 'CB', R)
     .go('CB', 'dl', 'CG', R);
    const ring = attachRing(M, 'CG', 'CB', 5,
      ['ND1', 'CE1', 'NE2', 'CD2'], R);
    const nd1 = M.get('ND1'), ne2 = M.get('NE2');
    nd1.el = 'N'; nd1.text = 'N';
    ne2.el = 'N'; ne2.text = 'NH';
    M.dbl('ND1', 'CE1', ring.c)
     .dbl('CD2', 'CG', ring.c);
  }
};

function buildAA(code, iso) {
  const M = Mol();
  backbone(M, iso);
  SIDECHAIN[code](M, iso);
  return M;
}

/* ------------------------------------------------------------------
   Rendering
   ------------------------------------------------------------------ */

const CHAR_HALF = 0.115;   // half-width of one character, in bond units
const LINE_HALF = 0.30;    // half-height of a text label

/* how far the label sticks out from the atom position, per side */
function extent(at) {
  if (!at.text) return { l: 0.05, r: 0.05, u: 0.05, d: 0.05 };
  const full = 2 * (CHAR_HALF * at.text.length + 0.05);
  if (at.anchor === 'end') {
    return { l: full - CHAR_HALF, r: CHAR_HALF, u: LINE_HALF, d: LINE_HALF };
  }
  if (at.anchor === 'start') {
    return { l: CHAR_HALF, r: full - CHAR_HALF, u: LINE_HALF, d: LINE_HALF };
  }
  return { l: full / 2, r: full / 2, u: LINE_HALF, d: LINE_HALF };
}

/* distance from the atom centre to the edge of its label, along (dx,dy) */
function trim(at, dx, dy) {
  if (!at.text) return 0;
  const ax = at.anchor === 'middle'
    ? CHAR_HALF * at.text.length + 0.09
    : 0.27;
  const ay = 0.33;
  return 1 / Math.hypot(dx / ax, dy / ay);
}

function textX(at) {
  if (at.anchor === 'end') return at.x + CHAR_HALF;
  if (at.anchor === 'start') return at.x - CHAR_HALF;
  return at.x;
}


/* Returns an <svg> string.
   opts: { form: 'neutral'|'ion', label: accessible name (defaults to the
   residue's name; a quiz passes something that does not give it away) } */
function moleculeSVG(code, opts = {}) {
  const iso = opts.form === 'ion';
  const M = buildAA(code, iso);
  const pad = opts.pad != null ? opts.pad : 0.45;

  let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
  for (const at of M.list) {
    const e = extent(at);
    minx = Math.min(minx, at.x - e.l); maxx = Math.max(maxx, at.x + e.r);
    miny = Math.min(miny, at.y - e.u); maxy = Math.max(maxy, at.y + e.d);
  }
  minx -= pad; maxx += pad; miny -= pad; maxy += pad;

  const parts = [];

  for (const bd of M.bonds) {
    const A = M.get(bd.a), B = M.get(bd.b);
    let dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;

    const tA = trim(A, dx, dy);
    const tB = trim(B, dx, dy);
    const x1 = A.x + dx * tA, y1 = A.y + dy * tA;
    const x2 = B.x - dx * tB, y2 = B.y - dy * tB;
    const cls = bd.side ? 'sc' : 'bb';

    if (bd.order === 2) {
      const px = -dy, py = dx;
      if (bd.inner) {
        /* ring double bond: full outer line plus a shortened inner one */
        const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
        const s = ((bd.inner[0] - mx) * px + (bd.inner[1] - my) * py) >= 0 ? 1 : -1;
        const o = 0.16 * s;
        const k = 0.16;
        parts.push(svgLine(x1, y1, x2, y2, cls));
        parts.push(svgLine(
          x1 + px * o + dx * k, y1 + py * o + dy * k,
          x2 + px * o - dx * k, y2 + py * o - dy * k, cls));
      } else {
        const o = 0.085;
        parts.push(svgLine(x1 + px * o, y1 + py * o, x2 + px * o, y2 + py * o, cls));
        parts.push(svgLine(x1 - px * o, y1 - py * o, x2 - px * o, y2 - py * o, cls));
      }
    } else {
      parts.push(svgLine(x1, y1, x2, y2, cls));
    }
  }

  for (const at of M.list) {
    if (!at.text) continue;
    const cls = (at.side ? 'sc' : 'bb') + ' el-' + at.el;
    parts.push(
      `<text x="${fmt(textX(at))}" y="${fmt(at.y)}" text-anchor="${at.anchor}" ` +
      `class="${cls}">${esc(at.text)}</text>`);
  }

  const w = maxx - minx, h = maxy - miny;
  const label = opts.label || `Skeletal structure of ${aa(code).name}`;
  return `<svg class="mol" viewBox="${fmt(minx)} ${fmt(miny)} ${fmt(w)} ${fmt(h)}" ` +
         `preserveAspectRatio="xMidYMid meet" role="img" ` +
         `aria-label="${esc(label)}">${parts.join('')}</svg>`;
}

function svgLine(x1, y1, x2, y2, cls) {
  return `<line x1="${fmt(x1)}" y1="${fmt(y1)}" x2="${fmt(x2)}" y2="${fmt(y2)}" class="${cls}"/>`;
}

function fmt(n) { return Math.round(n * 1000) / 1000; }

<script>
/* ------------------------------------------------------------------
   sky.js — the Sky Diary sky engine, ported from Em Time's sky.ts.

   Eight clock-keyed keyframes blended in OKLab, the sun and moon arcs,
   the light/dark polarity snap, and the per-minute contrast check that
   picks the ink for clear glass. The pure parts have no DOM access and
   run in Node for verify.js; applySky / startSky are the only writers.

   Modes: 'sky' follows the clock, 'light' pins 12:30, 'dark' pins 02:30.
   ------------------------------------------------------------------ */

const SKY_KEYFRAMES = [
  //      id           min  [top,      mid,       horizon,   hillBack,  hillFront] [sunIn,    sunOut,    sunGlow,                   moonGlow]                 [cloud,    cloudA, stars]
  kf('latenight',  150, ['#070D22', '#101C40', '#22305E', '#18234A', '#111A3A'], ['#FFD9A0', '#FF7A59', 'rgba(255,140,100,0)',    'rgba(150,170,255,0.35)'], ['#4A578A', 0.18, 1]),
  kf('dawn',       360, ['#A9CBF0', '#F6CFD6', '#FFDDB5', '#B9D3EE', '#9CC0E6'], ['#FFF1C9', '#FFB46B', 'rgba(255,180,107,0.55)', 'rgba(150,170,255,0.15)'], ['#FFF4F0', 0.9,  0.15]),
  kf('morning',    510, ['#6EB8F2', '#A9D8FA', '#E3F3FD', '#C6E9E4', '#A8DCD4'], ['#FFFBE6', '#FFD86B', 'rgba(255,236,170,0.60)', 'rgba(150,170,255,0)'],    ['#FFFFFF', 1,    0]),
  kf('midday',     750, ['#4FA8EE', '#8CC8F5', '#D6EEFC', '#BFE6D9', '#9FD6C6'], ['#FFFDF0', '#FFE07A', 'rgba(255,244,190,0.65)', 'rgba(150,170,255,0)'],    ['#FFFFFF', 1,    0]),
  kf('afternoon',  960, ['#5AA7E6', '#A3CDEF', '#FBE3C6', '#C3E2D2', '#A6D2BD'], ['#FFF4D6', '#FFC861', 'rgba(255,214,140,0.60)', 'rgba(150,170,255,0)'],    ['#FFFDF8', 0.95, 0]),
  kf('dusk',      1110, ['#363F88', '#7D5596', '#F09A7E', '#5A4F8E', '#463F7A'], ['#FFD9A0', '#FF7A59', 'rgba(255,140,100,0.55)', 'rgba(190,180,255,0.30)'], ['#F6C3D0', 0.7,  0.35]),
  kf('evening',   1230, ['#1E2A5E', '#34407E', '#6B5A94', '#2A3468', '#222B58'], ['#FFD9A0', '#FF7A59', 'rgba(255,140,100,0)',    'rgba(170,190,255,0.45)'], ['#7C88BC', 0.35, 0.8]),
  kf('night',     1380, ['#0B1430', '#16244D', '#2B3D73', '#1A2A55', '#142147'], ['#FFD9A0', '#FF7A59', 'rgba(255,140,100,0)',    'rgba(159,180,255,0.40)'], ['#56639A', 0.22, 1])
];

function kf(id, atMin, sky, sun, cloud) {
  return {
    id, atMin,
    top: sky[0], mid: sky[1], horizon: sky[2], hillBack: sky[3], hillFront: sky[4],
    sunInner: sun[0], sunOuter: sun[1], sunGlow: sun[2], moonGlow: sun[3],
    cloudFill: cloud[0], cloudOpacity: cloud[1], starOpacity: cloud[2]
  };
}

/* Polarity: light from 05:15 to 16:59, dark otherwise. */
const POLARITY_FLIP_MIN = { toLight: 315, toDark: 1020 };
const SKY_INK = { dark: '#10263F', light: '#FFFFFF' };   // navy on light skies, white on dark
const GLASS_INK = { navy: '#10263F', white: '#EEF5FF' };

const PIN_LIGHT = 750;   // 12:30
const PIN_DARK = 150;    // 02:30, the deepest night

/* ---- colour math ---------------------------------------------- */

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function hexToLab(hex) {
  const [R, G, B] = hexToRgb(hex);
  const lin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const r = lin(R), g = lin(G), b = lin(B);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [
    0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s
  ];
}

function labToHex([L, a, b]) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  const rgb = [
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s
  ].map(c => {
    const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.max(c, 0) ** (1 / 2.4) - 0.055;
    return Math.round(Math.min(1, Math.max(0, v)) * 255);
  });
  return '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
}

/* Blend two hex colours in OKLab, so dusk into evening never greys out. */
function mixHex(a, b, t) {
  if (t <= 0) return a.toUpperCase();
  if (t >= 1) return b.toUpperCase();
  const A = hexToLab(a), B = hexToLab(b);
  return labToHex([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]);
}

const num = (a, b, t) => a + (b - a) * t;
const round = (n, d = 3) => Math.round(n * 10 ** d) / 10 ** d;

function parseRgba(c) {
  const m = /rgba?\(([^)]+)\)/.exec(c);
  const p = (m ? m[1] : '0,0,0,1').split(',').map(x => parseFloat(x));
  return [p[0], p[1], p[2], p[3] == null ? 1 : p[3]];
}

function mixRgba(a, b, t) {
  if (t <= 0) return a;
  if (t >= 1) return b;
  const A = parseRgba(a), B = parseRgba(b);
  const r = A.map((v, i) => num(v, B[i], t));
  return `rgba(${Math.round(r[0])},${Math.round(r[1])},${Math.round(r[2])},${round(r[3])})`;
}

function relLum(hex) {
  const [r, g, b] = hexToRgb(hex).map(c => {
    const v = c / 255;
    return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/* WCAG contrast ratio of two opaque hex colours. */
function contrastRatio(fg, bg) {
  const a = relLum(fg), b = relLum(bg);
  return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
}

/* Alpha-composite an rgba() colour over an opaque hex; returns opaque hex. */
function composite(rgba, under) {
  const [r, g, b, a] = parseRgba(rgba);
  const [R, G, B] = hexToRgb(under);
  const f = (s, u) => Math.round(s * a + u * (1 - a));
  return '#' + [f(r, R), f(g, G), f(b, B)].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
}

/* Straight sRGB lerp, used only to sample the sky gradient at a height. */
function lerpHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}

/* ---- clear glass ----------------------------------------------- */

const GLASS_TARGET = 4.6;   // above the 4.5:1 floor so rounding cannot tip it under
const GLASS_ZONES = { top: [0, 0.2, 0.3, 0.4], low: [0.55, 0.7, 0.8, 0.85] };
/* White the glass itself adds under a label: plain, then selected/hovered, per polarity. */
const GLASS_LIFT = { light: [0.06, 0.4], dark: [0.04, 0.23] };

/* Clear glass keeps almost nothing under its labels, so the ink is picked
   per minute — navy or white, whichever needs the thinner help — plus a
   scrim of the opposite tone only where neither reaches 4.5:1 on its own. */
function glassFor(sky, polarity, preferNavy, zone) {
  const under = GLASS_ZONES[zone].map(y =>
    y <= 0.55 ? lerpHex(sky.top, sky.mid, y / 0.55) : lerpHex(sky.mid, sky.horizon, (y - 0.55) / 0.45));
  const [plain, bead] = GLASS_LIFT[polarity];
  const order = preferNavy ? ['navy', 'white'] : ['white', 'navy'];
  let best = { ink: GLASS_INK.navy, scrim: 'transparent', alpha: Infinity };
  for (const tone of order) {
    const ink = GLASS_INK[tone];
    const base = tone === 'navy' ? '255,255,255' : '8,16,40';
    const lift = tone === 'navy' ? plain : bead;
    for (let a = 0; a <= 0.7001 && a < best.alpha; a += 0.05) {
      const alpha = Math.round(a * 100) / 100;
      const ok = under.every(u =>
        contrastRatio(ink, composite(`rgba(255,255,255,${lift})`,
          alpha ? composite(`rgba(${base},${alpha})`, u) : u)) >= GLASS_TARGET);
      if (ok) {
        best = { ink, scrim: alpha ? `rgba(${base},${alpha})` : 'transparent', alpha };
        break;
      }
    }
  }
  return { ink: best.ink, scrim: best.scrim };
}

/* ---- state ------------------------------------------------------ */

function polarityAt(minutes) {
  const m = ((minutes % 1440) + 1440) % 1440;
  return m >= POLARITY_FLIP_MIN.toLight && m < POLARITY_FLIP_MIN.toDark ? 'light' : 'dark';
}

/* Nearest keyframe by circular distance; ties go to the later one. */
function nearestPhase(minutes) {
  const m = ((minutes % 1440) + 1440) % 1440;
  let best = SKY_KEYFRAMES[0], bestD = Infinity, bestAhead = false;
  for (const k of SKY_KEYFRAMES) {
    const forward = (k.atMin - m + 1440) % 1440;
    const d = Math.min(forward, 1440 - forward);
    const ahead = forward <= 720;
    if (d < bestD || (d === bestD && ahead && !bestAhead)) { best = k; bestD = d; bestAhead = ahead; }
  }
  return best.id;
}

const SUN_START = 330;    // 05:30
const SUN_SPAN = 840;     // to 19:30
const MOON_START = 1140;  // 19:00
const MOON_SPAN = 690;    // to 06:30 next day
const FADE_MIN = 20;

function body(elapsed, span) {
  if (elapsed < 0 || elapsed > span) return { visible: false, p: 0, opacity: 0 };
  const opacity = Math.min(1, elapsed / FADE_MIN, (span - elapsed) / FADE_MIN);
  return { visible: true, p: elapsed / span, opacity: Math.max(0, opacity) };
}

/* Lunar phase from the mean synodic month, anchored at the 2000-01-06 new moon. */
function moonPhase(now) {
  const SYNODIC = 29.530588853;
  const days = (now.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
  const age = ((days % SYNODIC) + SYNODIC) % SYNODIC;
  return { illumination: (1 - Math.cos((2 * Math.PI * age) / SYNODIC)) / 2, waxing: age < SYNODIC / 2 };
}

/* Pure: the whole sky at a local clock time. `date` only drives the moon phase. */
function skyAt(minutes, date = new Date()) {
  const t = ((minutes % 1440) + 1440) % 1440;
  const n = SKY_KEYFRAMES.length;
  let ai = n - 1;
  for (let i = 0; i < n; i++) if (SKY_KEYFRAMES[i].atMin <= t) ai = i;
  const A = SKY_KEYFRAMES[ai], B = SKY_KEYFRAMES[(ai + 1) % n];
  const aAt = A.atMin <= t ? A.atMin : A.atMin - 1440;
  const bAt = B.atMin > aAt ? B.atMin : B.atMin + 1440;
  const k = (t - aAt) / (bAt - aAt);

  const top = mixHex(A.top, B.top, k);
  const mid = mixHex(A.mid, B.mid, k);
  const horizon = mixHex(A.horizon, B.horizon, k);
  const ink = Math.min(contrastRatio(SKY_INK.dark, top), contrastRatio(SKY_INK.dark, mid)) >=
              Math.min(contrastRatio(SKY_INK.light, top), contrastRatio(SKY_INK.light, mid))
    ? SKY_INK.dark : SKY_INK.light;
  const polarity = polarityAt(t);
  const navy = ink === SKY_INK.dark;
  const glass = glassFor({ top, mid, horizon }, polarity, navy, 'top');
  const glassLow = glassFor({ top, mid, horizon }, polarity, navy, 'low');
  const moonElapsed = t >= MOON_START ? t - MOON_START : t + 1440 - MOON_START;

  return {
    minutes: t, phase: nearestPhase(t), polarity,
    top, mid, horizon,
    hillBack: mixHex(A.hillBack, B.hillBack, k),
    hillFront: mixHex(A.hillFront, B.hillFront, k),
    sunInner: mixHex(A.sunInner, B.sunInner, k),
    sunOuter: mixHex(A.sunOuter, B.sunOuter, k),
    sunGlow: mixRgba(A.sunGlow, B.sunGlow, k),
    moonGlow: mixRgba(A.moonGlow, B.moonGlow, k),
    cloudFill: mixHex(A.cloudFill, B.cloudFill, k),
    cloudOpacity: round(num(A.cloudOpacity, B.cloudOpacity, k)),
    starOpacity: round(num(A.starOpacity, B.starOpacity, k)),
    ink,
    glassInk: glass.ink, glassScrim: glass.scrim,
    glassInkLow: glassLow.ink, glassScrimLow: glassLow.scrim,
    sun: body(t - SUN_START, SUN_SPAN),
    moon: Object.assign(body(moonElapsed, MOON_SPAN), moonPhase(date))
  };
}

/* The sky for a theme mode. */
function skyFor(mode, now) {
  if (mode === 'light') return skyAt(PIN_LIGHT, now);
  if (mode === 'dark') return skyAt(PIN_DARK, now);
  return skyAt(now.getHours() * 60 + now.getMinutes(), now);
}

/* Back hill height: clamp(84px, 18vh, 170px). */
const backHillHeight = vh => Math.min(170, Math.max(84, vh * 0.18));

/* Body centre and size for a viewport. Rises left, sets right, sinks behind the back hill. */
function arcPosition(p, vw, vh, kind) {
  const desktop = vw >= 900;
  const size = kind === 'sun' ? (desktop ? 88 : 64) : (desktop ? 64 : 48);
  const horizon = vh - backHillHeight(vh) + size * 0.35;
  const apex = desktop ? 296 : (kind === 'moon' ? Math.max(180, horizon - 56) : 180);
  const x = vw * (0.06 + 0.88 * p);
  const y = horizon - Math.sin(Math.PI * p) * Math.max(0, horizon - apex);
  return { x, y, size };
}

/* ---- DOM writer ------------------------------------------------- */

const px = n => `${Math.round(n * 10) / 10}px`;

/* Writes the sky custom properties and html attributes, and syncs theme-color. */
function applySky(state, root = document.documentElement) {
  const vw = window.innerWidth, vh = window.innerHeight;
  const set = (k, v) => root.style.setProperty(k, v);
  set('--sky-top', state.top);
  set('--sky-mid', state.mid);
  set('--sky-horizon', state.horizon);
  set('--sky-hill-back', state.hillBack);
  set('--sky-hill-front', state.hillFront);
  set('--sky-ink', state.ink);
  set('--sky-ink-shadow', state.ink === SKY_INK.dark ? 'rgba(255,255,255,0.5)' : 'rgba(10,22,50,0.5)');
  set('--sky-lg-ink', state.glassInk);
  set('--sky-lg-scrim', state.glassScrim);
  set('--sky-lg-ink-low', state.glassInkLow);
  set('--sky-lg-scrim-low', state.glassScrimLow);
  set('--sky-sun-inner', state.sunInner);
  set('--sky-sun-outer', state.sunOuter);
  set('--sky-sun-glow', state.sunGlow);
  set('--sky-moon-glow', state.moonGlow);
  set('--sky-cloud-fill', state.cloudFill);
  set('--sky-cloud-opacity', String(state.cloudOpacity));
  set('--sky-star-opacity', String(state.starOpacity));
  set('--sky-star-vis', state.starOpacity > 0 ? 'visible' : 'hidden');

  const sun = arcPosition(state.sun.p, vw, vh, 'sun');
  set('--sky-sun-x', px(sun.x));
  set('--sky-sun-y', px(sun.y));
  set('--sky-sun-size', px(sun.size));
  set('--sky-sun-opacity', String(round(state.sun.opacity)));
  set('--sky-sun-display', state.sun.visible ? 'block' : 'none');

  const moon = arcPosition(state.moon.p, vw, vh, 'moon');
  set('--sky-moon-x', px(moon.x));
  set('--sky-moon-y', px(moon.y));
  set('--sky-moon-size', px(moon.size));
  set('--sky-moon-opacity', String(round(state.moon.opacity)));
  set('--sky-moon-display', state.moon.visible ? 'block' : 'none');
  /* the terminator: how far the shade disc slides off the moon, and which way */
  set('--sky-moon-illum', String(round(state.moon.illumination)));
  set('--sky-moon-waxing', state.moon.waxing ? '1' : '-1');

  root.dataset.theme = state.polarity;
  root.dataset.skyPhase = state.phase;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', state.top);
}

let currentMode = () => 'sky';

/* Recompute and write right now (after a theme change, visibility change or resize). */
function refreshSky() {
  const mode = currentMode();
  document.documentElement.dataset.themeMode = mode;
  applySky(skyFor(mode, new Date()));
}

/* Writes now, then once a minute on the minute, again when the tab becomes
   visible, and (debounced) on resize. Returns a stop function. */
function startSky(getMode) {
  currentMode = getMode;
  const root = document.documentElement;
  let timer = 0, resizeTimer = 0;
  const schedule = () => {
    clearTimeout(timer);
    timer = setTimeout(() => { refreshSky(); schedule(); }, 60000 - (Date.now() % 60000) + 30);
  };
  const onVisibility = () => {
    root.toggleAttribute('data-hidden', document.hidden);
    if (!document.hidden) { refreshSky(); schedule(); }
  };
  const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(refreshSky, 150); };
  root.toggleAttribute('data-hidden', document.hidden);
  refreshSky();
  schedule();
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('resize', onResize);
  return () => {
    clearTimeout(timer); clearTimeout(resizeTimer);
    document.removeEventListener('visibilitychange', onVisibility);
    window.removeEventListener('resize', onResize);
  };
}

/* ---- scene --------------------------------------------------------
   The engine only writes variables; this is the one bit of scene
   drawing that needs JavaScript: a scatter of stars from a seeded PRNG
   so the sky looks the same on every visit. Everything else is markup
   in index.html and CSS.
   ------------------------------------------------------------------ */
function buildStars(container, count) {
  let seed = 0x5eed;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const frag = document.createDocumentFragment();
  for (let i = 0; i < count; i++) {
    const s = document.createElement('i');
    const size = 1 + rand() * 1.6;
    s.style.cssText = `left:${(rand() * 100).toFixed(2)}%;top:${(rand() * 62).toFixed(2)}%;` +
      `width:${size.toFixed(2)}px;height:${size.toFixed(2)}px;` +
      `animation-delay:${(-rand() * 5).toFixed(2)}s;animation-duration:${(3 + rand() * 2).toFixed(2)}s`;
    frag.appendChild(s);
  }
  container.replaceChildren(frag);
}
</script>
<script>
/* ------------------------------------------------------------------
   app.js — screens, question generation, scoring and progress.
   ------------------------------------------------------------------ */

const ROUND_LEN = 12;
const GAUNTLET_SECONDS = 90;

/* ------------------------------------------------------------ yield

   Every question variant carries a tier. These are judgement calls
   about how often the topic actually turns up, not an official AAMC
   ranking — the Gauntlet's setting is the ceiling.

   HI  core content that appears on nearly every exam
   MED genuinely tested, but more specific
   LOW true and worth knowing, rarely examined

   The reference table ignores this entirely and always shows all of it.
   ------------------------------------------------------------------ */
const HI = 1, MED = 2, LOW = 3;

/* These describe the Gauntlet only. The other modes always run at full
   coverage no matter what this is set to. */
const YIELD_LEVELS = [
  { name: 'High yield',
    blurb: 'Only what turns up on nearly every exam: structures, one-letter codes, side-chain classes, charge at physiological pH, and the rule for finding a pI.' },
  { name: 'Exam scope',
    blurb: 'Everything the AAMC actually tests: adds three-letter codes, functional groups, pI estimation and gel migration.' },
  { name: 'Everything',
    blurb: 'Adds the rarely-examined long tail. The other modes always cover everything, whatever this is set to.' }
];

/* The setting governs the Gauntlet and nothing else. Outside it this flag
   is false, the ceiling opens to LOW, and every standalone mode serves
   its full range of questions. */
let yieldActive = false;

function yieldCap() { return yieldActive ? S.yield + 1 : LOW; }

/* Keep only items at or below the ceiling, never returning nothing. */
function atYield(items) {
  const ok = items.filter(i => i.y <= yieldCap());
  return ok.length ? ok : items;
}

/* -------------------------------------------------------------- icons
   20px stroke icons in currentColor, per the Button spec. */
const ICON = {
  hexagon: '<path d="M12 2.5 20.5 7.5v9L12 21.5 3.5 16.5v-9z"/>',

  sliders: '<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',

};

function icon(name) {

    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`;
}

const MODES = [
  { id: 'struct2name', icon: 'hexagon', name: 'Structure → Name',
    desc: 'See a skeletal structure, name the amino acid.' },
  { id: 'name2struct', icon: 'search', name: 'Name → Structure',

  { id: 'codes', icon: 'type', name: 'Abbreviations',

  { id: 'classify', icon: 'grid', name: 'Classify',

  { id: 'props', icon: 'sliders', name: 'Properties',

  { id: 'charge', icon: 'flask', name: 'Charge at pH',

  { id: 'isoelectric', icon: 'balance', name: 'pKa & pI',
