<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amino Acid Trainer — MCAT amino acid drills</title>
<meta name="description" content="A free study game for the twenty standard amino acids. Structures, one- and three-letter codes, side-chain classes, charge at any pH, and pI. Runs in your browser, nothing to install.">

<!-- The palette commits to light. Without this, a dark-mode OS renders
     the range slider and focus rings dark against a light page. -->
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f9fd">

<!-- Link preview for Reddit, Discord, iMessage. og:url is intentionally
     omitted so scrapers fall back to whatever URL they fetched. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Amino Acid Trainer">
<meta property="og:title" content="Amino Acid Trainer — MCAT amino acid drills">
<meta property="og:description" content="Free browser study game for the twenty amino acids: structures, abbreviations, charge at any pH, and pI. No install, no account, works offline.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Amino Acid Trainer — MCAT amino acid drills">
<meta name="twitter:description" content="Free browser study game for the twenty amino acids: structures, abbreviations, charge at any pH, and pI.">

<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='50%25' font-size='84' text-anchor='middle' dominant-baseline='central'>🧬</text></svg>">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <span class="logo">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M6 20 L13 24 L20 20 L20 12" stroke="var(--backbone)" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 24 L13 31" stroke="var(--rgroup)" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 12 L26 8" stroke="var(--backbone)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="6" cy="20" r="2.6" fill="var(--backbone)"/>
        <circle cx="13" cy="31" r="2.6" fill="var(--rgroup)"/>
      </svg>
      Amino Acid Trainer
    </span>
    <span class="spacer"></span>
  </div>

  <noscript>
    <p class="noscript">This trainer draws every structure in your browser, so it
    needs JavaScript switched on. Your answers and progress never leave your
    device either way — the only thing that does is an anonymous, cookie-free
    page-view count.</p>
  </noscript>

  <main id="app"></main>

  <footer class="sitefoot">
    <a class="coffee" href="https://buymeacoffee.com/dathan"
       target="_blank" rel="noopener noreferrer">Buy me a coffee?</a>
    <span class="venmo">venmo: <b>@dathanxbn</b></span>
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/chem.js"></script>
<script src="js/app.js"></script>

<!-- analytics:start
     GoatCounter: counts page views only. No cookies, no localStorage, no

     Dashboard: https://dathanbn.goatcounter.com -->
<script data-goatcounter="https://dathanbn.goatcounter.com/count"
