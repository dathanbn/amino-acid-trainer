<head>

<link rel="preload" href="fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%25' y='50%25' font-size='84' text-anchor='middle' dominant-baseline='central'>🧬</text></svg>">

<!-- Set the polarity before first paint so a night-time visit does not
     flash the day palette. The flip minutes match POLARITY_FLIP_MIN in
     js/sky.js, which takes over once it loads. -->
<script>
(function () {
  var pin = null;
  try { pin = (JSON.parse(localStorage.getItem('aa-game-v1') || '{}') || {}).theme || null; } catch (e) {}
  var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  var polarity = pin === 'light' ? 'light' : pin === 'dark' ? 'dark'
    : (m >= 315 && m < 1020 ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', polarity);
})();
</script>
</head>
<body>

<!-- The scene: a sky that follows the clock. Decorative only — never
     carries information, never focusable. -->
<div class="scene" aria-hidden="true">
  <div class="scene__stars" id="stars"></div>
  <div class="scene__sun"></div>
  <div class="scene__moon"></div>
  <svg class="scene__cloud scene__cloud--1" viewBox="0 0 132 56"><circle cx="34" cy="34" r="20"/><circle cx="64" cy="28" r="26"/><circle cx="96" cy="34" r="20"/><rect x="18" y="34" width="96" height="22" rx="11"/></svg>
  <svg class="scene__cloud scene__cloud--2" viewBox="0 0 132 56"><circle cx="34" cy="34" r="20"/><circle cx="64" cy="28" r="26"/><circle cx="96" cy="34" r="20"/><rect x="18" y="34" width="96" height="22" rx="11"/></svg>
  <svg class="scene__cloud scene__cloud--3" viewBox="0 0 132 56"><circle cx="34" cy="34" r="20"/><circle cx="64" cy="28" r="26"/><circle cx="96" cy="34" r="20"/><rect x="18" y="34" width="96" height="22" rx="11"/></svg>
  <div class="scene__hill scene__hill--back"></div>
  <div class="scene__hill scene__hill--front"></div>
</div>

<div class="wrap">

  <header class="topbar">
    <span class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <path d="M6 18 L13 22 L20 18 L20 10" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 22 L13 28" stroke="var(--sd-accent)" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M20 10 L26 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="6" cy="18" r="2.8" fill="currentColor"/>
        <circle cx="13" cy="28" r="2.8" fill="var(--sd-accent)"/>
      </svg>
      Amino Acid Trainer
    </span>
    <button class="iconbtn pin" id="themePin" type="button" aria-label="Sky follows the clock" data-tip="Sky follows the clock"></button>
  </header>

  <noscript>
    <p class="noscript">This trainer draws every structure in your browser, so it
    needs JavaScript switched on. Your answers and progress never leave your

  </noscript>

  <main id="app"></main>

  <footer class="sitefoot">
    <a class="sitefoot__coffee" href="https://buymeacoffee.com/dathan"
       target="_blank" rel="noopener noreferrer">Buy me a coffee?</a>
    <span class="sitefoot__venmo">venmo: <b>@dathanxbn</b></span>
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/chem.js"></script>
